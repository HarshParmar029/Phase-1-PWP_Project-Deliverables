{% extends "base.html" %}
{% block title %}Register Tourist{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:0 auto;">
  <h1>Tourist Registration</h1><p class="sub">Enter details to generate a Digital Tourist ID</p>
  <form method="POST" action="/register">
    <label>Full Name</label><input type="text" name="name" placeholder="e.g. Harsh Parmar" required>
    <label>Nationality</label><input type="text" name="nationality" placeholder="e.g. Indian" required>
    <label>Passport Number</label><input type="text" name="passport" placeholder="Stored only as a salted SHA-256 hash" required>
    <label>Emergency Contact</label><input type="text" name="emergency_contact" placeholder="+91 98XXXXXXXX" required>
    <div style="margin-top:20px;"><button type="submit" class="btn btn-primary">Generate Digital Tourist ID</button>
    <a href="/" class="btn btn-outline" style="margin-left:8px;">Cancel</a></div>
  </form>
</div>
{% endblock %}
